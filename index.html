<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm Corner</title>
<meta name="description" content="Calm Corner: a kid-friendly AI app for calming big feelings and turning conflicts into kind words. Built for Rotary AI for Good.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ff; --card:#ffffff; --ink:#2d2a4a; --soft:#6b6890; --line:#e6e1f7;
  --primary:#6c5ce7; --primary-ink:#ffffff; --primary-soft:#ece9ff;
  --angry:#ff7a6b; --angry-soft:#ffe8e4;
  --sad:#5aa9e6; --sad-soft:#e3f1fc;
  --worried:#f5b041; --worried-soft:#fff3dc;
  --okay:#3ec28f; --okay-soft:#ddf6ec;
  --radius:22px; --shadow:0 8px 24px rgba(76,61,160,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5;font-size:17px}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:.3em 0 .8em}
button{font:inherit;cursor:pointer}
a{color:var(--primary)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.5rem;font-weight:800}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--soft);font-weight:700;font-size:.95rem}
nav.tabs a.on{background:var(--primary-soft);color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin:14px 0;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;padding:13px 22px;font-weight:800;font-size:1.05rem;background:var(--primary);color:var(--primary-ink);transition:transform .1s, filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.small{padding:8px 14px;font-size:.92rem;border-radius:12px}
.btn.plain{background:transparent;color:var(--soft);padding:8px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr} h1{font-size:1.75rem} .pebble.big{width:84px;height:84px} .pebble{width:72px;height:72px} .card{padding:16px}}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--primary)}
.muted{color:var(--soft)} .tiny{font-size:.85rem}
.center{text-align:center}
.hidden{display:none!important}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Pebble */
.pebble-row{display:flex;align-items:flex-end;gap:14px;margin:6px 0 10px}
.pebble{flex:0 0 auto;width:96px;height:96px}
.pebble.big{width:140px;height:140px}
.pebble svg{width:100%;height:100%;overflow:visible}
.pebble .body{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.02,.98)}}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:700;max-width:520px;box-shadow:var(--shadow)}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* home */
.home-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.home-choices{grid-template-columns:1fr}}
.choice{text-align:left;border:none;border-radius:var(--radius);padding:22px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .15s, transform .1s}
.choice:hover{border-color:var(--primary)} .choice:active{transform:scale(.98)}
.choice .emoji{font-size:2.2rem}
.choice h3{margin:.3em 0 .2em}

/* feelings */
.feel-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.feel-chips{grid-template-columns:repeat(2,1fr)}}
.chip{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 8px;font-weight:800;text-align:center}
.chip .e{font-size:1.6rem;display:block}
.chip.on{border-color:var(--primary);background:var(--primary-soft)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:1.05rem}
.b-angry{background:var(--angry-soft);color:#c0392b} .b-sad{background:var(--sad-soft);color:#1f6fa8}
.b-worried{background:var(--worried-soft);color:#a86a00} .b-okay{background:var(--okay-soft);color:#1b7f59}
.meter{display:flex;gap:6px}
.meter button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 0;font-size:1.5rem}
.meter button.on{border-color:var(--primary);background:var(--primary-soft)}
.why{font-size:.9rem;color:var(--soft)}
.why code{background:var(--primary-soft);color:var(--primary);padding:1px 7px;border-radius:8px;font-family:inherit;font-weight:800}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:8px;font-size:.9rem;font-weight:700}
.bar .track{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .5s}

/* breathing */
.breath-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:330px}
.breath-ring{width:260px;height:260px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle, #fff 0 40%, transparent 41%), conic-gradient(var(--primary-soft) 0 100%);position:relative}
.breath-circle{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #a99cff, #6c5ce7);transform:scale(.45);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.5rem;font-weight:800;box-shadow:0 10px 40px rgba(108,92,231,.35);text-align:center;line-height:1.1}
.breath-label{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.6rem;font-weight:800;margin-top:14px;min-height:2.2rem}
@media (prefers-reduced-motion: reduce){.pebble .body{animation:none}}

/* grounding */
.g-step{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:3.4rem;font-weight:800;color:var(--primary);line-height:1}
.g-items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.g-item{background:var(--primary-soft);color:var(--primary);padding:6px 12px;border-radius:999px;font-weight:800}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--primary)}

/* coach */
.istatement{font-size:1.15rem;line-height:2.1;font-weight:700}
select.blank,input.blank{display:inline-block;min-width:80px;max-width:100%;width:auto;border:none;border-bottom:3px dashed var(--primary);background:var(--primary-soft);color:var(--primary);font:inherit;font-weight:800;padding:0 8px;border-radius:8px 8px 0 0;resize:none}
.meanometer{display:flex;align-items:center;gap:10px;font-weight:800}
.mm-track{flex:1;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--okay),var(--worried),var(--angry));position:relative}
.mm-dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink);transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.final-msg{background:var(--okay-soft);border-radius:18px;padding:14px 16px;font-weight:800;font-size:1.1rem}
.tips li{margin:.3em 0}
.toggle{display:inline-flex;background:var(--primary-soft);border-radius:999px;padding:4px}
.toggle button{border:none;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--primary)}
.toggle button.on{background:var(--primary);color:#fff}

/* safety */
.safety{background:#fff6e5;border:2px solid #f5c26b;border-radius:var(--radius);padding:20px}
.safety h2{color:#8a5a00}
.safety .big{font-size:1.25rem;font-weight:800}

footer{margin-top:30px;text-align:center;color:var(--soft);font-size:.85rem}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
table.data{width:100%;border-collapse:collapse;font-size:.92rem}
table.data td,table.data th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;font-weight:800;color:var(--primary)}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------------- storage helpers (safe if storage is blocked) ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

const LABELS = ['angry','sad','worried','okay'];
const META = {
  angry:  {emoji:'😠', name:'Angry',   color:'var(--angry)'},
  sad:    {emoji:'😢', name:'Sad',     color:'var(--sad)'},
  worried:{emoji:'😟', name:'Worried', color:'var(--worried)'},
  okay:   {emoji:'🙂', name:'Okay',    color:'var(--okay)'}
};

/* ---------------- Pebble the mascot (original character) ---------------- */
function pebbleSVG(mood){
  const fills = {angry:'#ffb3a8', sad:'#a9d3f5', worried:'#ffd98a', okay:'#b9ecd5', happy:'#c9c1ff'};
  const f = fills[mood] || fills.happy;
  const mouths = {
    angry:'M40 70 Q50 64 60 70', sad:'M40 72 Q50 64 60 72', worried:'M41 70 Q45 67 50 70 Q55 73 59 70',
    okay:'M39 66 Q50 77 61 66', happy:'M37 64 Q50 82 63 64'
  };
  const brows = mood==='angry' ? '<path d="M33 42 L44 46 M67 42 L56 46" stroke="#2d2a4a" stroke-width="3" stroke-linecap="round"/>'
             : mood==='worried' ? '<path d="M33 45 L43 41 M67 45 L57 41" stroke="#2d2a4a" stroke-width="3" stroke-linecap="round"/>'
             : mood==='sad' ? '<path d="M34 44 L43 41 M66 44 L57 41" stroke="#2d2a4a" stroke-width="3" stroke-linecap="round"/>' : '';
  const tear = mood==='sad' ? '<path d="M62 58 q3 6 0 8 q-3 -2 0 -8z" fill="#5aa9e6"/>' : '';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><g class="body">
    <ellipse cx="50" cy="94" rx="28" ry="4" fill="rgba(45,42,74,.12)"/>
    <path d="M18 62 C14 38 30 18 52 18 C74 18 88 36 84 60 C81 80 66 90 50 90 C33 90 21 80 18 62Z" fill="${f}" stroke="#2d2a4a" stroke-width="3"/>
    <path d="M30 30 Q38 24 46 25" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>
    ${brows}
    <circle cx="39" cy="53" r="4.5" fill="#2d2a4a"/><circle cx="61" cy="53" r="4.5" fill="#2d2a4a"/>
    <circle cx="40.5" cy="51.5" r="1.4" fill="#fff"/><circle cx="62.5" cy="51.5" r="1.4" fill="#fff"/>
    <circle cx="30" cy="63" r="4" fill="#ff8fa3" opacity=".55"/><circle cx="70" cy="63" r="4" fill="#ff8fa3" opacity=".55"/>
    <path d="${mouths[mood]||mouths.happy}" stroke="#2d2a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${tear}
  </g></svg>`;
}
function paintPebbles(root=document){ root.querySelectorAll('.pebble').forEach(p => p.innerHTML = pebbleSVG(p.dataset.mood||'happy')); }
function say(mood, html, big){ return `<div class="pebble-row"><span class="pebble ${big?'big':''}" data-mood="${mood}"></span><div class="bubble">${html}</div></div>`; }

/* ---------------- The ML model: Multinomial Naive Bayes trained in the browser ---------------- */
const STOP = new Set('a an the and or but to of i me my mine im i\'m is am are was were be been it its it\'s at in on for with that this so just really very do does did have has had get got feel feeling feels today right now about when they them their he she him her we us our you your'.split(' '));
const NEG = new Set(['not','no','never','dont','didnt','cant','wont','isnt','arent','wasnt','doesnt','couldnt','shouldnt','nobody','nothing']);
function stem(w){
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0,-3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0,-2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0,-1);
  return w;
}
function tokenize(text){
  const words = text.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const toks = []; let neg = false; const kept = [];
  for (const w of words){
    if (NEG.has(w)){ neg = true; toks.push(w); continue; }
    if (STOP.has(w)) continue;
    const s = stem(w);
    toks.push(neg ? 'not_'+s : s); kept.push(s); neg = false;
  }
  for (let i=0;i<kept.length-1;i++) toks.push(kept[i]+'_'+kept[i+1]);  // bigrams like "left_out", "what_if"
  if (/\bwhat if\b/i.test(text)) toks.push('__whatif');
  return toks;
}
class NaiveBayes{
  train(data){
    this.counts = {}; this.totals = {}; this.docs = {}; this.vocab = new Set(); let n = 0;
    for (const c of LABELS){ this.counts[c] = {}; this.totals[c] = 0; this.docs[c] = 0; }
    for (const c of LABELS) for (const s of (data[c]||[])){
      this.docs[c]++; n++;
      for (const t of tokenize(s)){ this.counts[c][t] = (this.counts[c][t]||0)+1; this.totals[c]++; this.vocab.add(t); }
    }
    this.n = n; return this;
  }
  logp(c,t){ return Math.log(((this.counts[c][t]||0)+1)/(this.totals[c]+this.vocab.size)); }
  predict(text){
    const toks = tokenize(text).filter(t => this.vocab.has(t));
    const scores = {};
    for (const c of LABELS){ scores[c] = Math.log(this.docs[c]/this.n); for (const t of toks) scores[c] += this.logp(c,t); }
    const mx = Math.max(...Object.values(scores)); let z = 0; const probs = {};
    for (const c of LABELS){ probs[c] = Math.exp(scores[c]-mx); z += probs[c]; }
    for (const c of LABELS) probs[c] /= z;
    const label = LABELS.slice().sort((a,b)=>probs[b]-probs[a])[0];
    // explanation: which known words pushed toward the winning label most
    const why = [...new Set(toks)].map(t => {
      const others = LABELS.filter(c=>c!==label).map(c=>this.logp(c,t));
      return {t, s: this.logp(label,t) - others.reduce((a,b)=>a+b,0)/others.length};
    }).filter(x=>x.s>0.4 && !x.t.includes('_') ).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>{
      // show the student's own word, not the chopped stem
      const w = text.toLowerCase().replace(/[’']/g,'').match(new RegExp('\\b'+x.t+'[a-z]*'));
      return w ? w[0] : x.t;
    });
    return {label, confidence: probs[label], probs, why, known: toks.length};
  }
}
const BASE_DATA = JSON.parse($('#training-data').textContent);
function trainingData(){
  const extra = store.get('cc_taught', []);
  const d = {}; for (const c of LABELS) d[c] = BASE_DATA[c].slice();
  for (const e of extra) if (d[e.label]) d[e.label].push(e.text);
  return d;
}
let model = new NaiveBayes().train(trainingData());
function retrain(){ model = new NaiveBayes().train(trainingData()); }

/* Optional: classify with the student's own Machine Learning for Kids model, fall back to the built-in model */
async function classify(text){
  const key = store.get('cc_ml4k_key','');
  if (key){
    try{
      const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 5000);
      const r = await fetch(`https://machinelearningforkids.co.uk/api/scratch/${encodeURIComponent(key)}/classify?data=${encodeURIComponent(text)}`, {signal: ctrl.signal});
      clearTimeout(timer);
      if (r.ok){
        const arr = await r.json();
        if (Array.isArray(arr) && arr.length){
          const top = arr[0]; const lbl = String(top.class_name||'').toLowerCase().trim();
          if (LABELS.includes(lbl)){
            const local = model.predict(text);
            return {label: lbl, confidence: (Number(top.confidence)||0)/100, probs: local.probs, why: local.why, known: local.known, source:'Machine Learning for Kids'};
          }
        }
      }
    }catch(e){ /* network or CORS blocked → use the built-in model */ }
  }
  return Object.assign(model.predict(text), {source:'built-in model'});
}

  const phases = [{t:'Breathe in… 🌬️', s:1, d:4000},{t:'Hold… 🤫', s:1, d:4000},{t:'Breathe out… 😮‍💨', s:.45, d:6000}];

    const p = phases[ph];
    bc.style.transition = `transform ${p.d}ms ease-in-out`; bc.style.transform = `scale(${p.s})`;
    bl.textContent = p.t;
    let left = Math.round(p.d/1000); bc.textContent = left;

      ph++;

/* ---------------- CONFLICT COACH ---------------- */
const INSULTS = ['stupid','idiot','idiots','dumb','loser','losers','jerk','jerks','ugly','annoying','weird','lame','mean','worst','hate','fat','freak','baby','crybaby','trash','useless','pathetic','moron','dummy','butthead','shut up','go away','nobody likes you','i hate you','whatever'];
const FEELING_WORDS = {angry:'frustrated', sad:'hurt', worried:'worried', okay:'upset'};
const FEELING_OPTIONS = ['frustrated','hurt','left out','sad','worried','embarrassed','disappointed','upset','angry','confused'];
const SUBJECT_TO_YOU = /\b(?:he|she|they|my (?:friend|best friend|brother|sister|classmate|cousin|teammate|partner))\b/i;
const VERB_STOP = new Set(['are','re','r','were','is','was','so','such','a','an','the','always','never','just','really','totally','being','too','very','like','guys','all']);

function hurtScore(text){
  const t = ' ' + text.toLowerCase() + ' ';
  let s = 0;
  for (const w of INSULTS) if (new RegExp('\\b'+w.replace(/ /g,'\\s+')+'\\b').test(t)) s += 2;
  s += (text.match(/!/g)||[]).length >= 2 ? 1 : 0;
  s += (text.match(/\b[A-Z]{3,}\b/g)||[]).length;
  if (/\b(always|never|everyone|nobody)\b/i.test(text)) s += 1;
  return Math.min(10, s);
}
function stripInsults(text){
  let t = text;
  for (const w of INSULTS.slice().sort((a,b)=>b.length-a.length)) t = t.replace(new RegExp('\\b'+w.replace(/ /g,'\\s+')+'\\b','gi'), ' ');
  return t.replace(/\s+/g,' ').trim();
}
const IRREGULAR = {take:'took',say:'said',tell:'told',leave:'left',break:'broke',make:'made',hit:'hit',steal:'stole',give:'gave',eat:'ate',run:'ran',throw:'threw',get:'got',go:'went',do:'did',forget:'forgot',read:'read',put:'put',cut:'cut',keep:'kept',send:'sent',write:'wrote',grab:'grabbed',trip:'tripped',stop:'stopped',drop:'dropped'};
function pastTense(v){
  if (IRREGULAR[v]) return IRREGULAR[v];
  if (v.endsWith('e')) return v + 'd';
  if (/[^aeiou]y$/.test(v)) return v.slice(0,-1) + 'ied';
  return v + 'ed';
}
function findAction(text){
  // Normalize third-person ("my friend ignored me") into "you ignored me" since the message is going to that person.
  let t = stripInsults(text).replace(/[“”"]/g,'');
  t = t.replace(new RegExp(SUBJECT_TO_YOU.source+'\\s+', 'gi'), 'you ');
  t = t.replace(/\byou're\b|\byoure\b/gi, 'you are').replace(/\byou guys\b/gi, 'you all');
  // "why did you laugh at me" -> "you laughed at me"
  t = t.replace(/\b(?:why\s+)?did\s+you\s+([a-z]+)/gi, (_, v) => 'you ' + pastTense(v.toLowerCase()));
  // "stop copying my drawing" -> "you keep copying my drawing"
  t = t.replace(/\b(?:please\s+)?stop\s+([a-z]+ing\b)/gi, 'you keep $1');
  const re =/\byou\s+((?:always|never|just|totally|really)\s+)?([a-z']+)([^.!?,;]*)/gi;
  let m;
  while ((m = re.exec(t))){
    let adverb = (m[1]||'').trim().toLowerCase();
    let verb = m[2].toLowerCase();
    if (VERB_STOP.has(verb)) continue;
    let rest = m[3].replace(/\b(and|but)\b.*$/i,'').trim();
    let phrase = (verb + ' ' + rest).trim().split(/\s+/).slice(0,9).join(' ');
    if (adverb === 'never'){
      // "you never let me play" -> "you didn't let me play"
      phrase = "didn't " + phrase.replace(/^(\w+)/, w => /[^s]s$/.test(w) ? w.slice(0,-1) : w);
    }
    phrase = phrase.toLowerCase().replace(/\bi\b/g,'I').replace(/\s+/g,' ').trim();
    while (/\s(you|and|but|so|like|guys|man|bro|too|ok|okay)$/.test(phrase) && !/\b(with|to|at|for|about|from|and)\s+you$/.test(phrase)) phrase = phrase.replace(/\s\S+$/,'');
    if (phrase) return 'you ' + phrase;
  }
  return null;
}
function findRequest(text, feeling){
  const t = text.toLowerCase();
  const rules = [
    [/ignor|left me out|leave me out|leaving me out|didn'?t invite|not invite|won'?t let me play|didn'?t let me play|never let me play|sit with|alone/, 'to be included next time'],
    [/took|take|grab|stole|steal|broke|break|ruin|touch(ed)? my|messed up my|borrow/, 'you to ask before using my things'],
    [/laugh|teas|make fun|made fun|called me|call me|name|joke|mock/, 'you to stop saying things that hurt my feelings'],
    [/\blie|\blied|blame|rumor|told everyone|gossip|secret/, 'us to be honest with each other'],
    [/push|shov|hit|kick|punch|trip/, 'you to keep your hands and feet to yourself'],
    [/interrupt|listen|talk over|cut me off/, 'you to let me finish talking'],
    [/cheat|unfair|not fair|rules|turn/, 'us to take turns and play fair'],
    [/copy|copied|copying/, 'to have space for my own ideas'],
    [/boss|tell me what to do|control/, 'us to decide things together'],
    [/text|message|group chat|online|post/, 'us to be kind to each other online too']
  ];
  for (const [r, req] of rules) if (r.test(t)) return req;
  return {angry:'us to talk about it calmly', sad:'us to talk and fix this', worried:'to know that we\'re okay', okay:'us to talk about it'}[feeling];
}
function makeIStatement(text, feelingLabel){
  const feeling = FEELING_WORDS[feelingLabel] || 'upset';
  const action = findAction(text);
  const because = action || 'of what happened';
  const request = findRequest(text, feelingLabel);
  return {feeling, because, request};
}
function sentence(p){ return `I feel ${p.feeling} because ${p.because}. I would like ${p.request}. Can we talk about it?`; }

let coachMode = store.get('cc_coach_mode','solo');
function viewCoach(app){
  app.innerHTML = `<section class="view">
    <div class="card">
      ${say('happy','Before you send something when you\'re mad, let\'s turn it into words that help fix things. Try an <b>"I feel… because…"</b> sentence!')}
      <div class="toggle" role="tablist">
        <button data-m="solo" class="${coachMode==='solo'?'on':''}">Just me</button>
        <button data-m="duo" class="${coachMode==='duo'?'on':''}">Two friends</button>
      </div>
    </div>
    <div id="coach-body"></div>
  </section>`;
  app.querySelectorAll('.toggle button').forEach(b => b.onclick = () => { coachMode = b.dataset.m; store.set('cc_coach_mode', coachMode); viewCoach(app); paintPebbles(app); });
  const body = $('#coach-body');
  if (coachMode === 'solo'){
    body.innerHTML = `<div class="card">
      <label for="c-in" style="font-weight:800">What do you want to say? (It's okay if it's angry. Only you see it.)</label>
      <textarea id="c-in" rows="3" maxlength="400" placeholder="e.g. You're so mean, you ignored me at lunch!!"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="c-go">Make it kind ✨</button>
        <button class="btn plain small" id="c-ex">Try an example</button>
      </div>
    </div><div id="c-out"></div>`;
    const examples = ['You\'re so annoying, you took my pencil AGAIN!!','You never let me play with you guys, I hate you','Why did you laugh at me in class? You\'re so mean','my friend ignored me at lunch and I\'m mad'];
    let ex = 0;
    $('#c-ex').onclick = () => { $('#c-in').value = examples[ex++ % examples.length]; };
    $('#c-go').onclick = async () => {
      const text = $('#c-in').value.trim(); if (!text){ toast('Type your message first'); return; }
      const out = $('#c-out');
      if (needsGrownUp(text)){ out.innerHTML = safetyCard(); paintPebbles(out); logSession({kind:'safety'}); return; }
      const res = await classify(text);
      const label = res.label === 'okay' ? 'angry' : res.label;
      const parts = makeIStatement(text, label);
      out.innerHTML = renderRewrite(text, parts, 'solo');
      paintPebbles(out); wireRewrite(out, parts, text);
      logSession({kind:'coach', feeling: label});
      out.scrollIntoView({behavior:'smooth', block:'start'});
    };
  } else {
    body.innerHTML = `<div class="grid2">
      <div class="card"><h3>🟣 Friend A's side</h3><textarea id="d-a" rows="3" maxlength="300" placeholder="What happened, from your side?"></textarea></div>
      <div class="card"><h3>🟢 Friend B's side</h3><textarea id="d-b" rows="3" maxlength="300" placeholder="What happened, from your side?"></textarea></div>
    </div>
    <div class="row"><button class="btn" id="d-go">Help us talk it out 🤝</button><button class="btn plain small" id="d-ex">Try an example</button></div>
    <div id="d-out"></div>`;
    $('#d-ex').onclick = () => { $('#d-a').value = 'You took the ball and wouldn\'t give it back, that\'s so unfair'; $('#d-b').value = 'You never pass the ball to me and you yelled at me'; };
    $('#d-go').onclick = async () => {
      const a = $('#d-a').value.trim(), b = $('#d-b').value.trim(); const out = $('#d-out');
      if (!a || !b){ toast('Both friends need to write their side'); return; }
      if (needsGrownUp(a) || needsGrownUp(b)){ out.innerHTML = safetyCard(); paintPebbles(out); logSession({kind:'safety'}); return; }
      const ra = await classify(a), rb = await classify(b);
      const pa = makeIStatement(a, ra.label==='okay'?'angry':ra.label), pb = makeIStatement(b, rb.label==='okay'?'angry':rb.label);
      out.innerHTML = `<div class="grid2">
        <div class="card view"><h3>🟣 Friend A can say</h3><div class="final-msg">"${esc(sentence(pa))}"</div></div>
        <div class="card view"><h3>🟢 Friend B can say</h3><div class="final-msg">"${esc(sentence(pb))}"</div></div>
      </div>
      <div class="card view">
        ${say('okay','Now let\'s fix it together! Take turns. One talks, one listens.')}
        <ol class="tips">
          <li><b>Friend A</b> reads their sentence. <b>Friend B</b> says back: <i>"I heard you feel ${esc(pa.feeling)} because ${esc(pa.because.replace(/\byou\b/g,'I').replace(/\bme\b/g,'you').replace(/\bmy\b/g,'your'))}."</i></li>
          <li>Switch! <b>Friend B</b> reads. <b>Friend A</b> says back what they heard.</li>
          <li>Each friend picks one thing to do: say sorry 💬 · make a plan for next time 📋 · take a short break 🌿 · ask a grown-up to help 🙋</li>
          <li>Make a deal: 🟣 Friend A asked for <b>${esc(pa.request.replace(/\bmy\b/g,"A's"))}</b>. 🟢 Friend B asked for <b>${esc(pb.request.replace(/\bmy\b/g,"B's"))}</b>. Can you both agree?</li>
        </ol>
        <div class="row"><button class="btn" id="d-done">We made up! 🎉</button><button class="btn ghost" id="d-break">We need a break first</button></div>
      </div>`;
      paintPebbles(out);
      $('#d-done').onclick = () => { confetti(); toast('Peacemakers! 🕊️'); logSession({kind:'coach-duo', resolved:true}); };
      $('#d-break').onclick = () => { logSession({kind:'coach-duo', resolved:false}); location.hash = 'checkin'; setTimeout(()=>startActivity('angry',{quick:true}),30); };
      out.scrollIntoView({behavior:'smooth', block:'start'});
    };
  }
}
function renderRewrite(original, p){
  const before = hurtScore(original);
  return `<div class="card view">
    ${say('okay','Here\'s a way to say it that helps fix things. You can change any blue part!')}
    <div class="meanometer"><span>Hurt-o-meter</span><div class="mm-track"><div class="mm-dot" id="mm" style="left:${10+before*8}%"></div></div><span id="mm-label">${before}/10</span></div>
    <p class="istatement" style="margin-top:14px">
      I feel <select class="blank" id="r-feel">${FEELING_OPTIONS.map(f=>`<option ${f===p.feeling?'selected':''}>${f}</option>`).join('')}</select>
      because <input class="blank" id="r-because" type="text" value="${esc(p.because)}" size="${Math.max(12,p.because.length)}">.
      I would like <input class="blank" id="r-req" type="text" value="${esc(p.request)}" size="${Math.max(12,p.request.length)}">.
    </p>
    <div class="final-msg" id="r-final"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="r-copy">📋 Copy message</button><button class="btn ghost" id="r-say">I said it in person 🎉</button></div>
    <details style="margin-top:14px"><summary>Talk-it-out tips</summary>
      <ul class="tips"><li>Find a calm time and place. Not in front of everyone.</li><li>Look at them and use a calm voice.</li><li>Listen to their side without interrupting.</li><li>Find one thing you both agree on.</li><li>If it doesn't go well, ask a grown-up to help.</li></ul>
    </details>
  </div>`;
}
function wireRewrite(out, p){
  const update = () => {
    const parts = {feeling: $('#r-feel').value, because: $('#r-because').value.trim() || 'of what happened', request: $('#r-req').value.trim() || 'us to talk about it'};
    $('#r-final').textContent = '"' + sentence(parts) + '"';
    return sentence(parts);
  };
  ['r-feel','r-because','r-req'].forEach(id => $('#'+id).addEventListener('input', update));
  update();
  setTimeout(() => { const s = hurtScore(update()); const mm = $('#mm'); if (mm){ mm.style.left = (10 + s*8) + '%'; $('#mm-label').textContent = s + '/10 🕊️'; } }, 700);
  $('#r-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(update()); toast('Copied! Read it once more before you send 💜'); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($('#r-final')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Press Ctrl/Cmd + C to copy'); }
  };
  $('#r-say').onclick = () => { confetti(); toast('Brave and kind! 🕊️'); };
}

/* ---------------- STATS ---------------- */
function viewStats(app){
  const s = store.get('cc_stats', []);
  const checks = s.filter(x=>x.kind==='checkin');
  const counts = {}; LABELS.forEach(c=>counts[c] = checks.filter(x=>x.feeling===c).length);
  const max = Math.max(1, ...Object.values(counts));
  const withBoth = checks.filter(x=>x.before && x.after);
  const avgB = withBoth.length ? withBoth.reduce((a,x)=>a+x.before,0)/withBoth.length : 0;
  const avgA = withBoth.length ? withBoth.reduce((a,x)=>a+x.after,0)/withBoth.length : 0;
  const coach = s.filter(x=>x.kind && x.kind.startsWith('coach')).length;
  const acts = {}; checks.forEach(x=>acts[x.activity]=(acts[x.activity]||0)+1);
  app.innerHTML = `<section class="view">
    <div class="card">
      <h1>Class stats</h1>
      <p class="muted">Anonymous counts only. No names or messages are ever saved. Data stays on this device.</p>
      <div class="grid2" style="margin-top:10px">
        <div><h3>Feelings checked in</h3>
          <div class="bars">${LABELS.map(c=>`<div class="bar"><span>${META[c].emoji} ${META[c].name}</span><div class="track"><div class="fill" style="width:${counts[c]/max*100}%;background:${META[c].color}"></div></div><span>${counts[c]}</span></div>`).join('')}</div>
        </div>
        <div><h3>Did it help?</h3>
          ${withBoth.length ? `<p style="font-size:1.1rem">Average feeling size went from <b>${avgB.toFixed(1)}</b> → <b>${avgA.toFixed(1)}</b> after an activity.</p>
            <p class="muted">${Math.round(withBoth.filter(x=>x.after<x.before).length/withBoth.length*100)}% of check-ins ended with a smaller feeling.</p>` : '<p class="muted">No check-ins yet.</p>'}
          <p>🤝 Conflict Coach used <b>${coach}</b> time${coach===1?'':'s'}.</p>
        </div>
      </div>
      ${Object.keys(acts).length ? `<h3 style="margin-top:14px">Favorite activities</h3><table class="data"><tr><th>Activity</th><th>Times</th></tr>${Object.entries(acts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>` : ''}
      <div class="row" style="margin-top:16px">
        <button class="btn ghost small" id="s-demo">Add sample data (for demo)</button>
        <button class="btn plain small" id="s-clear">Clear stats</button>
      </div>
    </div>
  </section>`;
  $('#s-demo').onclick = () => {
    const acts = {angry:'Balloon breathing', worried:'5-4-3-2-1 game', sad:'Kindness boost', okay:'Gratitude moment'};
    const arr = store.get('cc_stats', []);
    const plan = ['angry','angry','angry','worried','worried','worried','worried','sad','sad','okay','okay','angry','worried','sad'];
    plan.forEach(f => { const b = 2 + Math.floor(Math.random()*4); arr.push({t:Date.now(), kind:'checkin', feeling:f, activity:acts[f], before:b, after:Math.max(1, b - 1 - Math.floor(Math.random()*2)), sample:true}); });
    for (let i=0;i<5;i++) arr.push({t:Date.now(), kind:'coach', sample:true});
    store.set('cc_stats', arr); viewStats(app);
  };
  $('#s-clear').onclick = () => { store.set('cc_stats', []); viewStats(app); };
}

/* ---------------- ABOUT ---------------- */
function viewAbout(app){
  const taught = store.get('cc_taught', []);
  const key = store.get('cc_ml4k_key','');
  const n = LABELS.reduce((a,c)=>a+BASE_DATA[c].length,0);
  app.innerHTML = `<section class="view">
    <div class="card">
      ${say('happy','Here\'s how I work!')}
      <h1>About Calm Corner</h1>
      <p><b>The problem:</b> Kids have big feelings and small conflicts every day. When nobody helps in the moment, a mean text or a shove at recess can grow into a bigger fight. Calm Corner gives students a private place to calm down, plus a coach that turns angry words into kind ones.</p>
      <p><b>Rotary area of focus:</b> Peacebuilding and conflict prevention, plus mental well-being. Peace starts with one calm conversation.</p>
    </div>
    <div class="card">
      <h2>🧠 How the AI works</h2>
      <ol>
        <li><b>Training:</b> We wrote ${n} example sentences the way students really talk, labeled <i>angry, sad, worried,</i> or <i>okay</i>. The same sentences can be uploaded to <a href="https://machinelearningforkids.co.uk" target="_blank" rel="noopener">Machine Learning for Kids</a> to train a model there.</li>
        <li><b>Model:</b> Inside the app, a <b>Naive Bayes text classifier</b> learns which words go with each feeling. It runs entirely in your browser, so nothing a student types is sent anywhere.</li>
        <li><b>Explainable:</b> Pebble shows which words helped it decide, and how sure it is about each feeling.</li>
        <li><b>Learns from you:</b> When a student corrects Pebble, that sentence becomes new training data and the model retrains instantly. Students taught Pebble <b>${taught.length}</b> new example${taught.length===1?'':'s'} on this device.</li>
        <li><b>Conflict Coach:</b> Finds the action that hurt ("you ignored me"), removes insults, and builds an "I feel… because… I would like…" sentence with a matching request.</li>
      </ol>
      <details><summary>See the training data</summary>
        <table class="data"><tr><th>Feeling</th><th>Examples</th><th>Sample</th></tr>
        ${LABELS.map(c=>`<tr><td>${META[c].emoji} ${META[c].name}</td><td>${BASE_DATA[c].length}</td><td class="muted">"${esc(BASE_DATA[c][0])}", "${esc(BASE_DATA[c][5])}"</td></tr>`).join('')}</table>
      </details>
      ${taught.length ? `<div class="row" style="margin-top:10px"><button class="btn plain small" id="ab-reset">Reset what students taught Pebble</button></div>` : ''}
    </div>
    <div class="card">
      <h2>🔌 Use your Machine Learning for Kids model (optional)</h2>
      <p class="muted">Train a text project in Machine Learning for Kids with the labels <b>angry, sad, worried, okay</b>, then paste its API key here. Calm Corner will ask your model first, and use the built-in model if yours can't be reached.</p>
      <div class="row"><input type="password" id="ab-key" placeholder="Paste API key" value="${esc(key)}" style="flex:1"><button class="btn small" id="ab-save">Save</button><button class="btn ghost small" id="ab-test">Test</button></div>
      <p class="tiny muted" id="ab-status">${key ? 'Key saved on this device.' : 'No key saved. Using the built-in model.'}</p>
    </div>
    <div class="card">
      <h2>🛡️ Safety &amp; privacy by design</h2>
      <ul class="tips">
        <li>If a message mentions being hurt, wanting to hurt yourself or someone else, or feeling unsafe, Calm Corner skips the activity and tells the student to talk to a trusted adult, and shows the 988 Lifeline.</li>
        <li>No accounts, no names, and no messages are saved. Class stats are anonymous counts on the device.</li>
        <li>Calm Corner helps with everyday feelings. It is not a replacement for counselors, teachers, or parents.</li>
      </ul>
    </div>
  </section>`;
  const r = $('#ab-reset'); if (r) r.onclick = () => { store.set('cc_taught', []); retrain(); viewAbout(app); paintPebbles(app); toast('Pebble is back to its original training'); };
  $('#ab-save').onclick = () => { store.set('cc_ml4k_key', $('#ab-key').value.trim()); $('#ab-status').textContent = $('#ab-key').value.trim() ? 'Key saved on this device.' : 'Key removed. Using the built-in model.'; toast('Saved'); };
  $('#ab-test').onclick = async () => {
    store.set('cc_ml4k_key', $('#ab-key').value.trim());
    const res = await classify('my friend ignored me and I am mad');
    $('#ab-status').textContent = `Test: "${res.label}" from the ${res.source}.` + (res.source !== 'Machine Learning for Kids' && $('#ab-key').value.trim() ? ' (Could not reach your model, so the built-in one answered.)' : '');
  };
}

/* ---------------- confetti ---------------- */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#6c5ce7','#ff7a6b','#5aa9e6','#f5b041','#3ec28f','#ff8fa3'];
  for (let i=0;i<70;i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw'; p.style.background = colors[i%colors.length];
    p.style.animationDuration = (1.6 + Math.random()*1.6) + 's'; p.style.animationDelay = (Math.random()*.4) + 's';
    p.style.transform = `rotate(${Math.random()*360}deg)`; box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 3800);
}

// expose for testing
window.CalmCorner = {model: () => model, classify, makeIStatement, sentence, needsGrownUp, tokenize, hurtScore};
paintPebbles(); route();
})();
